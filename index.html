<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>锦囊</title>
<meta name="description" content="365 个小主意：冷场的时候翻一张。装在主屏幕上，断网也能用。">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="锦囊">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<!-- 样式顺序固定：令牌 → 外壳 → 各组件 → 设计师的皮肤（最后） -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/widgets-basic.css">
<link rel="stylesheet" href="css/widgets-logic.css">
<link rel="stylesheet" href="css/widgets-duel.css">
<link rel="stylesheet" href="css/widgets-party.css">
<link rel="stylesheet" href="css/widgets-sim.css">
<link rel="stylesheet" href="css/widgets-phys.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="app" class="app" data-view="feed" data-mode="me">

  <!-- 顶栏一行：左边「我看 / 一起看」，中间可横滑的类型条，右边筛选 -->
  <header id="topbar" class="topbar">
    <div id="mode" class="mode" role="group" aria-label="谁在看"></div>
    <nav id="typebar" class="typebar" aria-label="按类型筛选"></nav>
    <button id="filterBtn" class="topbar__filter" type="button" aria-label="筛选">
      <svg class="jn-ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-filter"/></svg>
      <span class="topbar__filter-txt">筛选</span>
      <span class="topbar__n jn-num" hidden></span>
    </button>
  </header>

  <main id="views" class="views">
    <section id="feed" class="feed" aria-label="卡片">
      <div class="feed__track"></div>
      <div class="feed__empty" hidden></div>
    </section>
    <section id="page-discover" class="page" aria-label="发现" hidden></section>
    <section id="page-saved" class="page" aria-label="收藏" hidden></section>
    <section id="page-me" class="page" aria-label="我的" hidden></section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="主导航">
    <button class="tabbar__tab" type="button" data-tab="feed" aria-current="page">
      <svg class="jn-ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-feed"/></svg><span>刷</span>
    </button>
    <button class="tabbar__tab" type="button" data-tab="discover">
      <svg class="jn-ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-discover"/></svg><span>发现</span>
    </button>
    <button id="rescueBtn" class="tabbar__rescue" type="button" aria-label="救场：冷场了点这里">
      <svg class="jn-ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-rescue"/></svg><span>救场</span>
    </button>
    <button class="tabbar__tab" type="button" data-tab="saved">
      <svg class="jn-ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-saved"/></svg><span>收藏</span>
    </button>
    <button class="tabbar__tab" type="button" data-tab="me">
      <svg class="jn-ic" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-me"/></svg><span>我的</span>
    </button>
  </nav>

  <div id="layers" class="layers"></div>
  <div id="toasts" aria-live="polite"></div>
  <div class="app__broken" role="alert">
    <p>没能打开。连上网再试一次。</p>
    <button id="retryBtn" class="jn-btn" type="button">再试一次</button>
  </div>
  <noscript><div class="app__broken" style="display:grid"><p>锦囊需要打开 JavaScript 才能用。</p></div></noscript>
</div>

<!-- 兜底：所有脚本都跑完（或有的没下载到）以后，外壳还没就绪，就把上面那句话亮出来，不留一个空壳 -->
<script>
window.addEventListener('load', function () {
  var app = document.getElementById('app');
  if (app && app.getAttribute('data-ready') !== '1') app.setAttribute('data-broken', '1');
});
document.getElementById('retryBtn').addEventListener('click', function () { window.location.reload(); });
</script>

<!-- 脚本顺序固定：公共能力 → 雪碧图 → 卡片数据 → 各组件 → 外壳。经典脚本，共用 window.JN -->
<script src="js/core.js"></script>
<script src="js/sprites.js"></script>
<script src="data/cards.js"></script>
<script src="js/widgets/basic.js"></script>
<script src="js/widgets/logic.js"></script>
<script src="js/widgets/duel.js"></script>
<script src="js/widgets/party.js"></script>
<script src="js/widgets/sim.js"></script>
<script src="js/widgets/phys.js"></script>
<script src="js/store.js"></script>
<script src="js/app-ui.js"></script>
<script src="js/app-card.js"></script>
<script src="js/app-feed.js"></script>
<script src="js/app-views.js"></script>
<script src="js/app-overlays.js"></script>
<script src="js/app.js"></script>
</body>
</html>
