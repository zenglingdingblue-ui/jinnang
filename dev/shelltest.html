<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SHELLTEST RUNNING</title>
<style>
  html, body { margin: 0; background: #111; color: #cfd6e4; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #f { display: block; border: 0; background: #000; }
  pre { margin: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<!-- 锦囊 · 外壳自测（外壳工程师 A）

  把 ../index.html 放进一个手机尺寸的 iframe，在里面模拟点按、拖动、键盘、滚轮和返回键，把结果写进 <pre id="report">。

  一、跑自测（无头浏览器；iframe 要读得到里面的页面，所以直接开文件时必须带 allow-file-access-from-files）：
      cd 项目根目录
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --no-first-run \
        --user-data-dir="$(mktemp -d)" --allow-file-access-from-files --virtual-time-budget=240000 \
        --window-size=900,1000 --dump-dom "file://$(pwd)/dev/shelltest.html" | grep -o '<pre id="report">.*</pre>'
      结果是一段 JSON：{ size, cards, tests, passed, failed, errors[], results[{name, ok, info, err}] }；标题变成 SHELLTEST DONE。
      也可以起一个本地服务器（python3 -m http.server）后在浏览器里打开 dev/shelltest.html 看着它跑。
      参数：?size=320x568 换一个屏幕尺寸；?only=feed,mode 只跑名字里含这些词的测试。
      自测会临时清掉 localStorage 里 jn.* 的数据，跑完原样放回。

  二、截「点过以后」的样子（tools/shot.sh 只能截刚打开的页面；这里先在 iframe 里点几下、填字、滚动，再让它截）：
      bash tools/shot.sh "dev/shelltest.html?frame=390x844&u=index.html%23c%3Dpuz-001&click=.reveal__btn" dev/shots/a/reveal-open.png 390 844 5000
      frame 手机尺寸，宽x高
      u     相对项目根的页面和参数（# 写成 %23，= 写成 %3D，& 写成 %26）
      click 载入后依次点击的选择器，用 | 分隔（例：click=.either__opt|.either__pass|.either__opt 截两人选完的样子）
      type  点击之后往某个输入框里填字，写成 选择器:文字（例：type=.search__input:篮球）
      scroll 再把某个容器滚到指定位置，写成 选择器:像素（例：scroll=%23page-me:900）
      hold  最后按住某个元素不放（看长按的按下状态用：按下大约在载入后 0.7 秒，shot.sh 的等待毫秒给 1150 左右；
            无头截图用的是虚拟时间，进度环的过渡不一定走得动，要看环请用真机或桌面浏览器）
-->
<iframe id="f" title="被测页面"></iframe>
<pre id="report">running…</pre>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var frame = document.getElementById('f');
  var report = document.getElementById('report');
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function load(url) {
    return new Promise(function (resolve) {
      frame.onload = function () { resolve(); };
      frame.src = url;
    });
  }
  function setSize(spec) {
    var m = /^(\d+)x(\d+)$/.exec(spec || '') || [0, 390, 844];
    frame.style.width = m[1] + 'px';
    frame.style.height = m[2] + 'px';
    return { w: +m[1], h: +m[2] };
  }

  /* ------------------------------------------------------------ 截图外框 */
  if (q.get('frame')) {
    setSize(q.get('frame'));
    report.hidden = true;
    load('../' + (q.get('u') || 'index.html')).then(async function () {
      var doc;
      try { doc = frame.contentDocument; } catch (e) { doc = null; }
      await wait(+q.get('wait') || 700);
      var clicks = (q.get('click') || '').split('|').filter(Boolean);
      for (var i = 0; i < clicks.length && doc; i++) {
        var n = doc.querySelector(clicks[i]);
        if (n) n.click();
        await wait(450);
      }
      var ty = (q.get('type') || '').split(':');
      if (ty[0] && doc && doc.querySelector(ty[0])) { var inp = doc.querySelector(ty[0]); inp.value = ty.slice(1).join(':'); inp.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true })); await wait(200); }
      var sc = (q.get('scroll') || '').split(':');
      if (sc[0] && doc && doc.querySelector(sc[0])) { doc.querySelector(sc[0]).scrollTop = +sc[1] || 0; await wait(200); }
      if (q.get('hold') && doc) {
        var h = doc.querySelector(q.get('hold'));
        var W = frame.contentWindow;
        if (h) h.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true, pointerId: 7, isPrimary: true, pointerType: 'touch', button: 0 }));
        await wait(+q.get('holdms') || 400);
      }
      document.title = 'FRAME READY';
    });
    return;
  }

  /* ------------------------------------------------------------ 自测 */
  var size = setSize(q.get('size'));
  var only = (q.get('only') || '').split(',').filter(Boolean);
  var results = [];
  var errors = [];
  var current = '';
  var W, D, JN, S, F;

  function ok(cond, msg) { if (!cond) throw new Error(msg || '断言失败'); }
  function eq(a, b, msg) { if (a !== b) throw new Error((msg || '不相等') + '：得到 ' + JSON.stringify(a) + '，应为 ' + JSON.stringify(b)); }
  function $(sel) { return D.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(D.querySelectorAll(sel)); }
  function cur() { return $('.feed .card.is-cur'); }
  function click(target) {
    var n = typeof target === 'string' ? $(target) : target;
    ok(n, '找不到要点的元素 ' + target);
    n.click();
    return n;
  }
  function visible(n) { return !!n && !n.hidden && n.getClientRects().length > 0; }
  function ptr(type, target, x, y, extra) {
    var o = { bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, pointerType: 'touch', button: 0, clientX: x, clientY: y };
    if (extra) for (var k in extra) o[k] = extra[k];
    target.dispatchEvent(new W.PointerEvent(type, o));
  }
  /** 在 target 上模拟一次拖动：从 (x0,y0) 到 (x1,y1)，分 steps 步，每步间隔 gap 毫秒；最后自动补一个 click（真实浏览器也会给） */
  async function drag(target, x0, y0, x1, y1, steps, gap, holdEnd) {
    ptr('pointerdown', target, x0, y0);
    for (var i = 1; i <= steps; i++) {
      await wait(gap);
      ptr('pointermove', target, x0 + (x1 - x0) * i / steps, y0 + (y1 - y0) * i / steps);
    }
    if (holdEnd) await wait(holdEnd);
    ptr('pointerup', target, x1, y1);
    target.dispatchEvent(new W.MouseEvent('click', { bubbles: true, cancelable: true, clientX: x1, clientY: y1 }));
  }
  async function settle(ms) { F.finish(); await wait(ms || 30); F.finish(); }
  async function back() { W.history.back(); await wait(120); }
  function key(k, extra) {
    var o = { key: k, code: k === ' ' ? 'Space' : k, bubbles: true, cancelable: true };
    if (extra) for (var x in extra) o[x] = extra[x];
    D.body.dispatchEvent(new W.KeyboardEvent('keydown', o));
  }
  function deckIds() { return S.deck().map(function (c) { return c.id; }); }
  function firstOf(pred) { return S.deck().filter(pred)[0] || null; }
  async function goto(id) { ok(W.JN.app.gotoCard(id), '跳不到卡片 ' + id); await settle(40); eq(F.current().id, id, '当前卡片'); return cur(); }
  /** 一起看模式下不该出现的字：所有只给爸爸的卡片的标题，和所有卡片的爸爸提示 */
  var SHY = ['talk', 'do', 'trio'];          // 这三类卡片的来源在一起看模式下不露出来
  var _dad = null, _shy = null;
  function dadStrings() {
    if (_dad) return _dad;
    _dad = [];
    S.all.forEach(function (c) {
      if (S.isDadOnly(c)) _dad.push(c.title);
      if (c.hint) _dad.push(c.hint);
    });
    return _dad;
  }
  /** 一起看模式下不该出现的来源名：只被话匣子、一起做、三人局（或只给爸爸的卡片）引用过的那些。
   *  同一个来源如果「给他看 / 烧脑 / 一起玩」也在用，或者它恰好是某张卡片正文里的字，就不算。 */
  function shyRefs() {
    if (_shy) return _shy;
    var allowed = {}, legit = '', out = {};
    S.all.forEach(function (c) {
      if (S.isDadOnly(c)) return;
      legit += ' ' + [c.title, c.body, c.sub, c.more, c.explain, (c.options || []).join(' '), (c.steps || []).join(' '), (c.need || []).join(' '),
        c.reveal ? c.reveal.text + ' ' + (c.reveal.explain || '') : '', c.either ? c.either.a + ' ' + c.either.b + ' ' + (c.either.ask || '') : ''].join(' ');
      if (SHY.indexOf(c.type) < 0) (c.refs || []).forEach(function (r) { allowed[r.t] = 1; });
    });
    S.all.forEach(function (c) {
      if (!S.isDadOnly(c) && SHY.indexOf(c.type) < 0) return;
      (c.refs || []).forEach(function (r) { if (r.t && r.t.length >= 6 && !allowed[r.t] && legit.indexOf(r.t) < 0) out[r.t] = 1; });
    });
    return (_shy = Object.keys(out));
  }
  function shyRefsShown() {
    var text = D.body.textContent;
    return shyRefs().filter(function (t) { return text.indexOf(t) >= 0; });
  }
  function leak(where) {
    var text = D.body.textContent + ' ' + D.body.innerHTML;
    var hits = dadStrings().filter(function (s) { return s.length >= 4 && text.indexOf(s) >= 0; });
    if (hits.length) throw new Error(where + '：DOM 里出现了只给爸爸的内容「' + hits[0] + '」等 ' + hits.length + ' 处');
    var refs = shyRefsShown();
    if (refs.length) throw new Error(where + '：一起看时露出了话匣子 / 一起做 / 三人局（或爸爸卡片）的来源「' + refs[0] + '」等 ' + refs.length + ' 处');
    eq($$('.card[data-type="talk"] .card__refs, .card[data-type="do"] .card__refs, .card[data-type="trio"] .card__refs').length, 0, where + '：话匣子、一起做、三人局的卡面上不该有来源行');
    eq($$('.card__hint').length, 0, where + '：不该有爸爸提示按钮');
    eq($$('[data-type="insight"]').length, 0, where + '：不该有锦囊类型的元素');
  }
  /** 全屏浮层本身从第一帧起就该是不透明的（淡入只在里面的内容上） */
  function solid(el, name) {
    var cs = W.getComputedStyle(el);
    ok(cs.opacity === '1' && cs.animationName === 'none', name + '：浮层本身不该带淡入');
    ok(cs.backgroundColor && !/transparent|rgba\([^)]*,\s*0\)/.test(cs.backgroundColor), name + '：底色应不透明，得到 ' + cs.backgroundColor);
  }
  /** 当前卡片是不是一屏放得下（页脚没有被挤出卡片的内容区） */
  function fits(el) {
    var foot = el.querySelector('.card__foot');
    var pad = parseFloat(W.getComputedStyle(el).paddingBottom) || 0;
    return foot.offsetTop + foot.offsetHeight <= el.clientHeight - pad + 1.5;
  }

  var tests = [];
  function test(name, fn) { tests.push({ name: name, fn: fn }); }
  window.__shelltest = { test: test, ok: ok, eq: eq };

  /* ---------------- 启动与牌序 ---------------- */
  test('启动：就绪、DOM 里三张卡片、第一张是今日锦囊', async function () {
    eq($('#app').getAttribute('data-ready'), '1', '应用没有就绪');
    ok(!$('#app').hasAttribute('data-broken'), '应用报了启动失败');
    eq($$('.feed__track > .card').length, 3, 'DOM 里的卡片数');
    eq(F.index(), 0, '起始位置');
    eq(F.current().id, S.today().id, '第一张应是今日锦囊');
    eq(cur().getAttribute('data-id'), S.today().id, '当前卡片的 data-id');
    ok(cur().querySelector('.card__today'), '今日锦囊应有徽标');
    ok(!$('.onboard'), '带深链接启动时不该弹引导');
    eq(W.location.hash, '', '读完深链接应该把 # 拿掉');
    return S.all.length + ' 张卡片，' + Object.keys(JN.widgets).length + ' 个组件';
  });

  test('牌序：不重复、数量对、相邻同类型很少、一年里每天的今日锦囊不同', async function () {
    var d = S.deck(), ids = deckIds();
    eq(new Set(ids).size, ids.length, '牌序里有重复');
    eq(ids.length, S.pool().length, '牌序长度');
    var adj = 0;
    for (var i = 0; i + 1 < d.length; i++) if (d[i].type === d[i + 1].type) adj++;
    ok(adj <= Math.max(2, d.length * 0.02), '相邻同类型太多：' + adj);
    eq(deckIds().join(), ids.join(), '同一天的牌序应当稳定');
    var seen = {};
    for (var k = 0; k < 365; k++) seen[S.today(new Date(2026, 0, 1 + k)).id] = 1;
    eq(Object.keys(seen).length, Math.min(365, S.pool().length), '365 天里不同的今日锦囊数');
    var other = S.deck(new Date(2031, 4, 5)).map(function (c) { return c.id; }).join();
    ok(other !== ids.join(), '换一天牌序应当不同');
    S.deck();
    return '相邻同类型 ' + adj + ' 处 / ' + d.length;
  });

  test('连续翻 400 页：不报错、不重复不错位、首尾循环、每张都一屏放得下', async function () {
    var d = S.deck(), n = d.length, start = F.index(), bad = [], maxFit = 0, clamped = 0, nopv = 0;
    var hasSeg = !!(W.Intl && W.Intl.Segmenter), split = [], wide = [], tall = [], lineStat = {};
    ok(n >= 3, '卡片太少，测不了');
    function check(k, i) {
      var p = F.peek();
      if (p.cur !== d[i].id || p.prev !== d[(i - 1 + n) % n].id || p.next !== d[(i + 1) % n].id || p.count !== 3 || p.y !== 0) {
        throw new Error('第 ' + k + ' 次翻页后错位：' + JSON.stringify(p) + '，应为 ' + d[i].id);
      }
      eq($$('.feed__track > .card.is-cur').length, 1, '当前卡片个数');
      eq($$('.feed__track > .card.is-prev').length, 1, '上一张个数');
      eq($$('.feed__track > .card.is-next').length, 1, '下一张个数');
      var c = cur();
      eq(c.getAttribute('data-id'), d[i].id, '当前卡片');
      eq(c.querySelector('.card__pos').textContent, '第 ' + (i + 1) + ' / ' + n, '序号');
      var fit = +c.getAttribute('data-fit');
      if (fit > maxFit) maxFit = fit;
      if (fit >= 3) clamped++;
      if (c.classList.contains('no-preview')) nopv++;
      if (!fits(c)) bad.push(d[i].id + '(fit' + fit + ')');
      // 标题：字一个不少；按词包好；没有哪个词被拆到两行，也没有哪个词顶出标题的宽度；最多三行
      var title = c.querySelector('.card__title'), tr = title.getBoundingClientRect();
      eq(title.textContent, d[i].title, d[i].id + ' 的标题文字');
      var lines = Math.round(title.offsetHeight / (parseFloat(W.getComputedStyle(title).lineHeight) || 1));
      lineStat[lines] = (lineStat[lines] || 0) + 1;
      if (lines > 3) tall.push(d[i].id);
      if (hasSeg) {
        var ws = title.querySelectorAll('.word');
        // 一个词都没包：只有整条标题都是「太长、不包」的一截（比如一串数字）时才说得过去
        if (!ws.length && JN.ui.wordTokens(d[i].title).some(function (k) { return !k.space && JN.ui.textWidth(k.t) <= 6; })) throw new Error(d[i].id + ' 的标题没有按词包起来');
        for (var w = 0; w < ws.length; w++) {
          if (ws[w].getClientRects().length !== 1) split.push(d[i].id + '「' + ws[w].textContent + '」');
          else if (ws[w].getBoundingClientRect().right > tr.right + 1.5) wide.push(d[i].id + '「' + ws[w].textContent + '」');
        }
      }
    }
    for (var k = 1; k <= 400; k++) { F.go(1); F.finish(); check(k, (start + k) % n); }
    for (var b = 1; b <= 60; b++) { F.go(-1); F.finish(); check(400 + b, (((start + 400 - b) % n) + n) % n); }
    ok(!bad.length, bad.length + ' 张放不下：' + bad.slice(0, 10).join(', '));
    ok(!split.length, '标题里有词被拆到两行：' + split.slice(0, 6).join(', '));
    ok(!wide.length, '标题里有词顶出了宽度：' + wide.slice(0, 6).join(', '));
    ok(!tall.length, '标题超过三行：' + tall.slice(0, 6).join(', '));
    return '最高收紧到 ' + maxFit + ' 级；需要截断的 ' + clamped + ' 张；收掉预览的 ' + nopv + ' 张；标题行数分布 ' + JSON.stringify(lineStat) + (hasSeg ? '' : '（这个浏览器没有 Intl.Segmenter，标题没有按词包）');
  });

  /* ---------------- 手势、键盘、滚轮 ---------------- */
  test('手势：拖过去翻页、拖一点回弹、一甩翻页、横向不管；拖动过不算点击', async function () {
    var feed = $('#feed'), H = feed.clientHeight, x = 150, n = F.total();
    var i0 = F.index();
    await drag(feed, x, H * 0.7, x, H * 0.3, 8, 30, 200);          // 慢拖 40%
    await settle(40);
    eq(F.index(), (i0 + 1) % n, '慢拖过去应翻到下一张');
    await drag(feed, x, H * 0.6, x, H * 0.54, 4, 40, 250);         // 只拖 6%，停住再松手
    await settle(40);
    eq(F.index(), (i0 + 1) % n, '拖一点应回弹');
    eq(F.peek().y, 0, '回弹后轨道应归零');
    await drag(feed, x, H * 0.6, x, H * 0.6 - 70, 3, 14, 0);       // 70px 的快甩
    await settle(40);
    eq(F.index(), (i0 + 2) % n, '快甩应翻到下一张');
    await drag(feed, x, H * 0.3, x, H * 0.72, 8, 30, 200);         // 向下拖：上一张
    await settle(40);
    eq(F.index(), (i0 + 1) % n, '向下拖应回到上一张');
    await drag(feed, 60, H * 0.5, 260, H * 0.5 + 12, 6, 20, 0);    // 横向
    await settle(40);
    eq(F.index(), (i0 + 1) % n, '横向手势不该翻页');
    eq(F.peek().y, 0, '横向手势不该拖动轨道');
    // 从按钮上起手拖动：翻页，但按钮不算被点
    var id = F.current().id, fav = cur().querySelector('.rail__fav'), r = fav.getBoundingClientRect();
    var was = S.isFav(id);
    ptr('pointerdown', fav, r.left + 10, r.top + 10);
    for (var s = 1; s <= 8; s++) { await wait(25); ptr('pointermove', fav, r.left + 10, r.top + 10 - s * H * 0.05); }
    await wait(150);
    ptr('pointerup', fav, r.left + 10, r.top + 10 - H * 0.4);
    fav.click();
    await settle(40);
    eq(S.isFav(id), was, '拖动之后的点击应被吃掉');
    eq(F.index(), (i0 + 2) % n, '从按钮上起手也应能拖动翻页');
    // 不动的轻点：照常触发
    var fav2 = cur().querySelector('.rail__fav'), id2 = F.current().id, r2 = fav2.getBoundingClientRect();
    ptr('pointerdown', fav2, r2.left + 10, r2.top + 10);
    ptr('pointerup', fav2, r2.left + 10, r2.top + 10);
    fav2.click();
    ok(S.isFav(id2), '轻点收藏应生效');
    ok(fav2.classList.contains('is-on') && fav2.getAttribute('aria-pressed') === 'true', '收藏按钮状态');
    fav2.click();
    ok(!S.isFav(id2), '再点一次取消收藏');
  });

  test('键盘与滚轮：↑ ↓ 空格 PageUp PageDown；滚轮带防抖', async function () {
    var n = F.total(), i = F.index();
    var step = async function (fn, d, msg) { fn(); await settle(30); i = (i + d + n) % n; eq(F.index(), i, msg); };
    await step(function () { key('ArrowDown'); }, 1, '↓');
    await step(function () { key('ArrowUp'); }, -1, '↑');
    await step(function () { key(' '); }, 1, '空格');
    await step(function () { key(' ', { shiftKey: true }); }, -1, 'Shift+空格');
    await step(function () { key('PageDown'); }, 1, 'PageDown');
    await step(function () { key('PageUp'); }, -1, 'PageUp');
    var feed = $('#feed');
    var wheel = function (dy) { feed.dispatchEvent(new W.WheelEvent('wheel', { deltaY: dy, bubbles: true, cancelable: true })); };
    await wait(700);
    wheel(120);
    for (var k = 0; k < 14; k++) wheel(60 - k * 4);          // 一串惯性
    await settle(30);
    i = (i + 1) % n;
    eq(F.index(), i, '一次滚动（连同惯性）只翻一页');
    await wait(700);
    wheel(-120);
    await settle(30);
    i = (i - 1 + n) % n;
    eq(F.index(), i, '向上滚一页');
    await wait(700);
  });

  /* ---------------- 六种形态 ---------------- */
  test('形态 plain：有 more 才有「展开」，抽屉里读得到全文', async function () {
    var c = firstOf(function (c) { return c.format === 'plain' && c.more; });
    ok(c, '没有带 more 的 plain 卡片');
    var el = await goto(c.id);
    eq(el.getAttribute('data-format'), 'plain');
    S.setDone(c.id, false);
    click(el.querySelector('.card__cta'));

  /** 载入（或重新载入）被测页面，把 W / D / JN / S / F 绑到它身上 */
  var loads = 0;
  async function bind(hash) {
    await load('../index.html?run=' + (++loads) + (hash || ''));
    try { W = frame.contentWindow; D = W.document; JN = W.JN; S = JN.S; F = JN.feed; }
    catch (e) { errors.push('读不到 iframe 里的页面：直接开文件时要带 allow-file-access-from-files，或者改用本地服务器。' + e.message); return false; }
    if (!JN || !F) { errors.push('被测页面没有启动起来'); return false; }
    W.addEventListener('error', function (e) { errors.push(current + ' :: ' + e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
    W.addEventListener('unhandledrejection', function (e) { errors.push(current + ' :: promise ' + ((e.reason && e.reason.message) || e.reason)); });
    var origErr = W.console.error;
    W.console.error = function () { errors.push(current + ' :: console.error ' + Array.prototype.map.call(arguments, function (a) { return (a && a.stack) || String(a); }).join(' ').slice(0, 300)); origErr.apply(W.console, arguments); };
    JN.settings.sfx = false;
    JN.settings.haptic = false;
    _dad = _shy = null;
    return true;
  }
  async function reload(hash) { ok(await bind(hash), '重新载入失败'); await wait(300); }
  async function recover() {
    try {
      JN.ui.layers.closeAll();
      await wait(200);
      JN.app.show('feed');
      S.resetFilter();
      await settle(60);
    } catch (e) { /* noop */ }
  }
  async function main() {
    var backup = {};
    try {
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('jn.') === 0) backup[k] = localStorage.getItem(k); }
      Object.keys(backup).forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* noop */ }
    var bound = await bind('#view=feed');
    if (bound) {
      await wait(300);
      for (var t = 0; t < tests.length; t++) {
        var item = tests[t];
        if (only.length && !only.some(function (w) { return item.name.indexOf(w) >= 0; })) continue;
        current = item.name;
        var before = errors.length;
        try {
          var info = await item.fn();
          results.push({ name: item.name, ok: errors.length === before, info: info || '', err: errors.length === before ? '' : '期间有报错' });
        } catch (e) {
          results.push({ name: item.name, ok: false, err: String((e && e.message) || e) });
          await recover();
        }
        report.textContent = 'running… ' + results.length + ' / ' + tests.length;
      }
      current = '(结束后)';
      await wait(500);
    }
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('jn.') === 0) localStorage.removeItem(k); });
      Object.keys(backup).forEach(function (k) { localStorage.setItem(k, backup[k]); });
    } catch (e) { /* noop */ }
    var failed = results.filter(function (r) { return !r.ok; });
    var out = { size: size.w + 'x' + size.h, cards: S ? S.all.length : 0, tests: results.length, passed: results.length - failed.length, failed: failed.length, errors: errors, results: results };
    window.__report = out;
    report.textContent = 'SHELLTEST_JSON_BEGIN' + JSON.stringify(out) + 'SHELLTEST_JSON_END';
    document.title = 'SHELLTEST DONE';
  }
  main();
})();
</script>
